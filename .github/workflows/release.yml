name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Run tests
      run: cargo test --verbose

    - name: Install cargo-bundle
      run: cargo install cargo-bundle

    - name: Bundle .app
      run: cargo bundle --release

    - name: Zip .app bundle
      run: |
        cd target/release/bundle/osx
        zip -r Lapsus.zip Lapsus.app

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/bundle/osx/Lapsus.zip
        generate_release_notes: true
        append_body: true
        body: |
          ---

          > **Please note:** You will likely need to run the following command in your terminal as the app is signed ad-hoc:
          > (Assuming you have placed Lapsus in your Applications folder)
          > ```
          > xattr -r -d com.apple.quarantine ~/Applications/Lapsus.app
          > ```

          Thanks for your support!

          Margo

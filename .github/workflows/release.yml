name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Check tag matches Cargo.toml version
      run: |
        crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "Lapsus") | .version')
        if [ "v$crate_version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version. Update the version in Cargo.toml before tagging."
          exit 1
        fi

    - uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

    # cargo-bundle 0.12.0 depends on sigstore 0.14.0, which no longer compiles on newer Rust.
    # Build just this tool with a known-good toolchain. The app itself still uses stable.
    - name: Install cargo-bundle
      run: |
        rustup toolchain install 1.92.0 --profile minimal
        cargo +1.92.0 install cargo-bundle --version 0.12.0 --locked

    - name: Bundle .app
      run: cargo bundle --release

    - name: Zip .app bundle
      run: ditto -c -k --keepParent target/release/bundle/osx/Lapsus.app target/release/bundle/osx/Lapsus.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: target/release/bundle/osx/Lapsus.zip
        generate_release_notes: true
        append_body: true
        body: |
          ---

          > **Please note:** You will likely need to run the following command in your terminal as the app is signed ad-hoc:
          > (Assuming you have placed Lapsus in your Applications folder)
          > ```
          > xattr -r -d com.apple.quarantine ~/Applications/Lapsus.app
          > ```

          Thanks for your support!

          Margo
